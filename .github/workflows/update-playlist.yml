name: Update playlist

# Auto-refresh of the Frankly Speaking feeds.
#   src/data/videos.json  <- the YouTube broadcast playlist (yt-dlp)
#   src/data/podcast.json <- the Buzzsprout podcast RSS feed
# Commits only when something changed; the push triggers Vercel's auto-deploy
# (the repo is connected to the Vercel project).

on:
  schedule:
    # Every 10 minutes — a new episode appears on the site within ~10 min of upload.
    # (Free because the repo is public; GitHub Actions minutes are unlimited for public repos.)
    - cron: '*/10 * * * *'
  workflow_dispatch: {} # allow manual "Run workflow" from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-playlist
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install yt-dlp
        run: python3 -m pip install --upgrade --break-system-packages yt-dlp

      # Used by fetch-podcast.mjs to decode each new episode for its waveform.
      # Peaks are cached in podcast.json, so this only costs anything when an
      # episode is genuinely new. Without it the script still runs and simply
      # ships peaks: null, and the player falls back to a plain progress bar.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Fetch playlist
        run: node scripts/fetch-playlist.mjs

      # Separate step so a podcast-feed hiccup can never block the playlist
      # refresh (and vice versa) — each writes its own file.
      - name: Fetch podcast feed
        continue-on-error: true
        run: node scripts/fetch-podcast.mjs

      - name: Commit if either feed changed
        run: |
          if [ -n "$(git status --porcelain src/data/videos.json src/data/podcast.json)" ]; then
            git config user.name "playlist-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/data/videos.json src/data/podcast.json
            git commit -m "chore: refresh playlist + podcast (auto)"
            git push
            echo "Feeds updated and pushed."
          else
            echo "No new episodes — nothing to do."
          fi
